[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-web-scraper"
version = "1.0.0"
description = "A modern PyQt6 desktop web scraper"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyQt6>=6.8.1,<6.12",
    "requests>=2.32.5,<3",
    "beautifulsoup4>=4.12.3,<4.16",
    "lxml>=5.3,<7",
]

[project.gui-scripts]
modern-web-scraper = "main:main"

[tool.setuptools]
py-modules = ["main", "app", "scraper", "theme"]
